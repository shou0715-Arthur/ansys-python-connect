[project]
name = "aedt-connect"
version = "0.1.0"
description = "Python <-> Ansys AEDT 2025 R2 connection smoke tests (Icepak / Circuit)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyaedt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aedt_connect"]
